name: CI & Auto Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Homely Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Backend (NestJS)
        run: |
          cd server
          npm install
          npm run build

      - name: Install & Build Frontend (Next.js)
        run: |
          cd client
          npm install
          npm run build

      - name: Platform Verification
        run: echo "Homely E-Commerce Client & Server compiled and verified successfully!"

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Resolve VPS Config
        id: vps_config
        run: |
          USER="${{ secrets.VPS_USERNAME }}"
          if [ -z "$USER" ]; then
            USER="${{ secrets.VPS_USER }}"
          fi
          if [ -z "$USER" ]; then
            USER="root"
          fi
          echo "user=$USER" >> $GITHUB_OUTPUT

          PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$PORT" ]; then
            PORT="22"
          fi
          echo "port=$PORT" >> $GITHUB_OUTPUT

      - name: Install SSHPass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: SSH and Deploy to VPS
        run: |
          USER="${{ steps.vps_config.outputs.user }}"
          HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ steps.vps_config.outputs.port }}"
          PASS="${{ secrets.VPS_PASSWORD }}"

          if [ -z "$HOST" ] || [ -z "$PASS" ]; then
            echo "❌ Error: VPS_HOST or VPS_PASSWORD secret is missing in GitHub repository settings!"
            exit 1
          fi

          echo "🚀 Connecting to VPS ($USER@$HOST:$PORT)..."
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT" "$USER@$HOST" bash -s << 'EOF'
            set -e
            echo "🚀 Connected to VPS as $(whoami)"

            # Source environment paths for Node, NPM, and PM2
            [ -f /etc/profile ] && source /etc/profile || true
            [ -f ~/.profile ] && source ~/.profile || true
            [ -f ~/.bashrc ] && source ~/.bashrc || true
            if [ -d "$HOME/.nvm" ]; then
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # Determine project directory
            PROJECT_DIR="/opt/apps/sk_e_comerce"
            if [ ! -d "$PROJECT_DIR" ]; then
              if [ -d "/opt/apps/sk_e_commerce" ]; then
                PROJECT_DIR="/opt/apps/sk_e_commerce"
              elif [ -d "$HOME/sk_e_comerce" ]; then
                PROJECT_DIR="$HOME/sk_e_comerce"
              elif [ -d "/var/www/sk_e_comerce" ]; then
                PROJECT_DIR="/var/www/sk_e_comerce"
              fi
            fi

            echo "📂 Target Directory: $PROJECT_DIR"
            cd "$PROJECT_DIR" || { echo "Directory $PROJECT_DIR not found on VPS!"; exit 1; }

            echo "📥 Fetching and syncing latest code from GitHub main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "⚙️ Building Backend (NestJS)..."
            cd server
            npm install
            npm run build

            echo "⚙️ Building Frontend (Next.js)..."
            cd ../client
            npm install
            npm run build

            echo "🔄 Restarting application services..."
            cd ..
            if command -v pm2 &> /dev/null; then
              pm2 restart all || true
            else
              echo "Notice: PM2 command not in path, services may use systemd or docker"
            fi

            echo "🎉 [SUCCESS] Deployment completed on VPS! All changes are now live."
          EOF
