name: CI & Auto Deploy Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Homely Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Backend (NestJS)
        run: |
          cd server
          npm install
          npm run build

      - name: Install & Build Frontend (Next.js)
        run: |
          cd client
          npm install
          npm run build

      - name: Platform Verification
        run: echo "Homely E-Commerce Client & Server compiled and verified successfully!"
