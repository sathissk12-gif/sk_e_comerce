name: CI & Auto Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Homely Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Backend (NestJS)
        run: |
          cd server
          npm install
          npm run build

      - name: Install & Build Frontend (Next.js)
        run: |
          cd client
          npm install
          npm run build

      - name: Platform Verification
        run: echo "Homely E-Commerce Client & Server compiled and verified successfully!"

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Connected to VPS. Moving to project directory..."
            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "$PROJECT_DIR" ]; then
              if [ -d "$HOME/sk_e_comerce" ]; then
                PROJECT_DIR="$HOME/sk_e_comerce"
              elif [ -d "/var/www/sk_e_comerce" ]; then
                PROJECT_DIR="/var/www/sk_e_comerce"
              else
                PROJECT_DIR="."
              fi
            fi
            
            echo "📂 Deploying in: $PROJECT_DIR"
            cd "$PROJECT_DIR" || exit 1
            
            echo "📥 Pulling latest commits from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "⚙️ Installing & building Backend (NestJS)..."
            cd server
            npm install
            npm run build
            
            echo "⚙️ Installing & building Frontend (Next.js)..."
            cd ../client
            npm install
            npm run build
            
            echo "🔄 Restarting application services..."
            cd ..
            if command -v pm2 &> /dev/null; then
              pm2 restart all || true
            fi
            
            echo "✅ [Deploy] VPS Deployment Completed Successfully!"
